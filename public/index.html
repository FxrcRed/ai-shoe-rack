<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>落间</title>
<meta name="theme-color" content="#f5f5f5">
<link rel="stylesheet" href="style.css">
</head>
<body class="home hub">
<span id="mode" class="badge" hidden></span>
<nav class="stepbar" id="stepbar" hidden><button aria-label="首页"></button><button aria-label="拍照"></button><button aria-label="方案"></button><button aria-label="材质与结算"></button></nav>

<main>
<section id="s-home" class="page hero">
  <div class="head"><h1>落间</h1><button class="hubbtn" data-tab="s-saved" aria-label="我的方案"><svg viewBox="30 0 118 134"  fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M36 16V128M124 16V128M54 6V118M142 6V118M36 16H124L142 6H54ZM36 56H124L142 46H54ZM36 96H124L142 86H54ZM36 128H124L142 118H54Z"/></svg></button>
  <p class="lead">拍一张照，先试住，再定制。</p></div>
  <div class="media">
  <svg class="hero-art" viewBox="9 0 160 136" aria-hidden="true">
    <g class="rods">
      <path pathLength="1" style="--i:0" d="M36 128V16"/>
      <path pathLength="1" style="--i:1" d="M124 128V16"/>
      <path pathLength="1" style="--i:2" d="M54 118V6"/>
      <path pathLength="1" style="--i:3" d="M142 118V6"/>
      <path pathLength="1" style="--i:7" d="M36 16H124L142 6H54Z"/>
      <path pathLength="1" style="--i:6" d="M36 56H124L142 46H54Z"/>
      <path pathLength="1" style="--i:5" d="M36 96H124L142 86H54Z"/>
      <path pathLength="1" style="--i:4" d="M36 128H124L142 118H54Z"/>
    </g>
    <g class="items">
      <circle style="--i:1" cx="72" cy="44" r="8"/>
      <circle style="--i:2" cx="106" cy="47" r="5"/>
      <circle style="--i:0" cx="64" cy="84" r="10"/>
    </g>
  </svg>
  </div>
  <button class="primary big" data-go="s-photo">开始设计</button>
</section>

<section id="s-photo" class="page" hidden>
  <div class="media">
  <label for="cam" class="guide">
    <i class="sketch" aria-hidden="true"></i>
  </label>
  <div id="photos" class="photos"></div>
  <ol class="progress" id="gen-progress" hidden></ol>
  </div>
  <div class="row">
    <p class="guide-tip">竖着拍，拍进地面和墙脚线，拍到门更准</p>
    <label class="btn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>相册<input id="pick" type="file" accept="image/*" multiple hidden></label>
    <label class="btn primary"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>拍照<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
  </div>
  <div id="after" hidden>
    <textarea id="desc" rows="1" placeholder="想要什么样的？可不填，如：想挂雨伞"></textarea>
    <button class="primary big" id="gen" disabled>生成方案</button>
  </div>
</section>

<section id="s-design" class="page flow" hidden>
  <div class="media"><div id="stage-home" class="stage-box">
    <div id="stage" class="stage"><img id="stage-photo" alt=""><div class="handles" id="handles"></div></div>
  </div></div>
  <div class="sheet">
  <div class="seg" id="seg" hidden>
    <button data-pane="size" class="on">尺寸</button><button data-pane="more">配件</button><button data-pane="pos">位置</button><button data-pane="ai">修改</button>
  </div>
  <div class="panes">
    <div class="pane tips" data-pane="tips">
      <p id="scheme-intro" class="intro" hidden></p>
      <div class="size-row"><span id="scheme-dims"></span><button id="tune">调整</button></div>      <p class="pill check" id="check-msg" hidden></p>
      <div class="pill fit-msg" id="fit-msg" hidden></div>
    </div>
    <div class="pane" data-pane="size" hidden>
      <div class="dial" data-k="width"><span>宽</span><button class="step" data-d="-5">−</button><input type="range" min="30" max="200" step="1"><button class="step" data-d="5">+</button><output></output></div>
      <div class="dial" data-k="depth"><span>深</span><button class="step" data-d="-1">−</button><input type="range" min="15" max="60" step="1"><button class="step" data-d="1">+</button><output></output></div>
      <div class="dial" data-k="height"><span>高</span><button class="step" data-d="-5">−</button><input type="range" min="25" max="200" step="1"><button class="step" data-d="5">+</button><output></output></div>
      <div class="stepper" data-k="levels"><span>层数</span><button class="step" data-d="-1">−</button><b></b><button class="step" data-d="1">+</button></div>
    </div>
    <div class="pane" data-pane="more" hidden>
      <div class="stepper" data-k="hooks"><span>挂钩</span><button class="step" data-d="-1">−</button><b></b><button class="step" data-d="1">+</button></div>
      <div class="opt-row"><span>杆径</span><div class="chips sm" id="rods"></div></div>
      <label class="toggle"><input type="checkbox" id="umb"> 挂伞杆 <span class="hint">（右侧伸出 12cm，带接水盘）</span></label>
    </div>
    <div class="pane" data-pane="pos" hidden>
      <div class="row tight"><button id="rot-ccw">↺ 向左转</button><button id="rot-cw">↻ 向右转</button><button id="t-reset">按 AI 重新摆放</button></div>
      <p class="hint">单指拖动移位置，双指旋转缩放。</p>
    </div>
    <div class="pane" data-pane="ai" hidden>
      <div class="versions" id="versions"></div>
      <input id="feedback" placeholder="例如：再窄一点、换玻璃隔板、加一层">
      <div class="chips sm" id="quick"></div>
      <div class="row end"><button id="revise">让 AI 修改</button></div>
    </div>
  </div>
  </div>
  <div class="dock">
    <button id="another">换一个</button>
    <button id="adjust" hidden>完成</button>
    <button class="primary" id="choose">就这个了</button>
  </div>
</section>

<section id="s-pay" class="page flow pay" hidden>
  <div class="media tt"><div class="turntable" id="turntable"></div></div>
  <div class="sheet">
    <div class="panes">
      <div class="grp"><div class="mhd"><p class="label">隔板</p><button id="rec-use" hidden></button></div>
      <div class="chips cards" id="mats" data-cards></div></div>
      <div class="grp"><div class="mhd"><p class="label">杆色</p></div>
      <div class="chips swatch" id="fins" data-dots></div></div>
      <div id="admin-bom" hidden>
        <p class="label">零件价格表 <span class="hint">（仅管理员可见，单价可直接改）</span></p>
        <div class="table-wrap"><table id="bom"><thead><tr><th>名称</th><th>规格</th><th>数量</th><th>单价</th><th>小计</th></tr></thead><tbody></tbody></table></div>
        <p class="total">零件合计 <b id="total">0</b> 元</p>
        <div class="row end"><button id="csv">导出 CSV</button></div>
      </div>
    </div>
  </div>
  <div class="dock">
    <div class="price"><b id="est-price">—</b><small id="est-note">预估价 · 下单前人工复核尺寸</small></div>
    <button class="primary" id="order">保存方案</button>
  </div>
</section>
<section id="s-saved" class="page" hidden>
  <div class="head"><h1>我的方案</h1><button class="hubbtn" data-tab="s-home" aria-label="首页"><svg viewBox="30 0 118 134"  fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M36 16V128M124 16V128M54 6V118M142 6V118M36 16H124L142 6H54ZM36 56H124L142 46H54ZM36 96H124L142 86H54ZM36 128H124L142 118H54Z"/></svg></button></div>
  <div id="saved-list" class="saved"></div>
</section>
</main>
<div id="snap-view" class="snap-view" hidden><img id="snap-img" alt=""><p>方案已保存。长按图片可存到相册</p><button id="snap-saved" class="primary">看我的方案</button><button id="snap-close">返回</button></div>
<div id="toast" class="toast" hidden></div>
<script>
// 脚本出错时直接显示在页面上（手机上看不到控制台）；模块 404 只在 script 元素上触发 error，所以用捕获阶段
(function () {
  function say(m) { var t = document.getElementById('toast'); t.textContent = '页面出错：' + m + '（请截图反馈，或下拉刷新再试）'; t.hidden = false; }
  addEventListener('error', function (e) { if (/ResizeObserver loop/.test(e.message)) return; say(e.message || ('加载失败 ' + ((e.target && (e.target.src || e.target.href)) || ''))); }, true);
  addEventListener('unhandledrejection', function (e) { say(e.reason && e.reason.message || String(e.reason)); });
  // 用动态 import 加载：Safari 对模块加载/链接错误不触发 window error，这样能拿到具体原因
  var t0 = Date.now();
  import('./app.js').then(function () {}, function (e) { say((e && (e.name + ': ' + e.message)) || String(e)); });
  setTimeout(function () { if (!window.__app) say('脚本 15 秒还没加载完（已等 ' + Math.round((Date.now() - t0) / 1000) + ' 秒），网络慢的话再等等'); }, 15000);
})();
</script>
</body>
</html>
