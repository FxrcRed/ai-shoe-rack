<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机预览</title>
<style>
  /* 电脑上看手机效果：iPhone 14 尺寸（390×844）的外框，里面 iframe 跑 index.html；窗口小了整体等比缩小 */
  :root { --desk: linear-gradient(160deg, #e3e6f2, #c9cee4); --glass: rgba(255, 255, 255, .38); --rim: rgba(255, 255, 255, .75); --bar: #f2f3f7; --ink: #23243a; --muted: #75778a; }
  @media (prefers-color-scheme: dark) { :root { --desk: linear-gradient(160deg, #1d1f2b, #11121a); --glass: rgba(255, 255, 255, .07); --rim: rgba(255, 255, 255, .16); --bar: #14151c; --ink: #f1f1f6; --muted: #a4a6b8; } }
  html, body { margin: 0; height: 100%; }
  body { background: var(--desk); font: 13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--muted); overflow: hidden; }
  .tools { position: fixed; top: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 1; }
  .tools button, .tools a { font: inherit; color: var(--ink); background: transparent; border: 1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius: 980px; padding: 4px 12px; cursor: pointer; text-decoration: none; }
  .tools button:hover, .tools a:hover { background: color-mix(in srgb, var(--muted) 15%, transparent); }
  /* 毛玻璃外框（参考图那种半透明白边） */
  .phone { position: absolute; left: 50%; top: 50%; width: 390px; height: 844px; padding: 12px; border-radius: 60px; background: var(--glass);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: inset 0 0 0 1.5px var(--rim), 0 24px 60px rgba(59, 61, 92, .22); transform-origin: center; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden; background: var(--bar); display: flex; flex-direction: column; }
  .status { height: 47px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 36px; color: var(--ink); font-weight: 600; font-size: 15px; }
  .island { position: absolute; top: 11px; left: 50%; width: 122px; height: 35px; margin-left: -61px; border-radius: 20px; background: #000; }
  .icons { display: flex; gap: 5px; align-items: center; }
  .icons i { display: block; width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; opacity: .9; position: relative; }
  .icons i::after { content: ''; position: absolute; inset: 1.5px 6px 1.5px 1.5px; background: currentColor; border-radius: 1.5px; }
  iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--bar); }
</style>
</head>
<body>
<div class="tools"><button id="reload">刷新</button><a href="./" target="_blank">新标签页打开</a></div>
<div class="phone" id="phone">
  <div class="screen">
    <div class="status"><span id="clock">9:41</span><span class="icons"><i></i></span></div>
    <div class="island"></div>
    <iframe id="app" src="./" allow="microphone; camera; clipboard-write" title="鞋架页面"></iframe>
  </div>
</div>
<script>
  const phone = document.getElementById('phone'), app = document.getElementById('app');
  const fit = () => {
    const s = Math.min(1, (innerHeight - 70) / 844, (innerWidth - 32) / 390);
    phone.style.transform = `translate(-50%, calc(-50% + 18px)) scale(${s})`;
  };
  addEventListener('resize', fit); fit();
  document.getElementById('reload').onclick = () => app.contentWindow.location.reload();
  const tick = () => { const d = new Date(); document.getElementById('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
  tick(); setInterval(tick, 10000);
</script>
</body>
</html>
