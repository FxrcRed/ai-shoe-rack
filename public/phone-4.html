<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四页总览</title>
<style>
html,body{height:100%;margin:0;background:#c3cbe0;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#g{position:absolute;left:50%;top:50%;display:flex;gap:60px;transform-origin:0 0}
.p{position:relative;width:402px;height:874px;flex:none}
.phf{position:absolute;inset:-20px;border:2px solid #fff;border-radius:82px;box-sizing:border-box}
.phf i{position:absolute;width:3px;background:#fff;border-radius:2px}
.phs{position:absolute;inset:0;border:1px solid rgba(255,255,255,.85);border-radius:62px;box-sizing:border-box;pointer-events:none;z-index:5}
.scr{position:absolute;left:0;top:0;width:402px;height:874px;border-radius:62px;overflow:hidden;background:#d1d4e5}
.scr iframe{position:absolute;left:0;top:54px;width:402px;height:720px;border:0;display:block;background:#f5f5f5}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:8px 34px 0 44px;box-sizing:border-box;font:600 17px -apple-system,system-ui,sans-serif;color:#fff;pointer-events:none;z-index:2}
.sb .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;translate:-50% 0;width:124px;height:36px;box-sizing:border-box;border-radius:20px;z-index:3;pointer-events:none}
.wire .island{border:1px solid rgba(255,255,255,.85)}
.island svg{position:absolute;left:-1px;top:-1px;width:124px;height:36px;fill:none;stroke:rgba(255,255,255,.85)}
.sf{position:absolute;left:0;right:0;top:774px;height:100px;color:#fff;font-size:15px;z-index:2;pointer-events:none}
.sf>div{position:absolute;top:12px;height:56px;box-sizing:border-box;border:1px solid rgba(255,255,255,.85);border-radius:28px;display:flex;align-items:center;justify-content:space-around}
.sf .nv{left:34px;width:83px}.sf .url{left:126px;width:184px;gap:8px;padding:0 14px;justify-content:center}.sf .mo{left:321px;width:48px}
.hi{position:absolute;bottom:8px;left:50%;translate:-50% 0;width:140px;height:5px;border-radius:3px;background:#fff;opacity:.9;z-index:2;pointer-events:none}
a{position:fixed;top:16px;right:16px;z-index:9;padding:10px 16px;border-radius:999px;background:#fff;color:#1c1b24;font:600 14px -apple-system,system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(52,52,90,.12)}
</style>
<a href="phone-split.html">单机联动</a>
<a href="#" id="ann" style="right:120px">标注间距</a>
<div id="g"></div>
<script>
const g=document.getElementById('g');
const CH=`<iframe></iframe><div class="island"><svg viewBox="0 0 124 36"><circle cx="104" cy="18" r="8"/></svg></div>
<div class="sb"><span class="clk"></span><span class="r"><svg width="19" height="12" viewBox="0 0 19 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0 1 14 0M4 7a6.5 6.5 0 0 1 9 0"/><circle cx="8.5" cy="10" r="1.2" fill="#fff" stroke="none"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="#fff" opacity=".5"/></svg></span></div>
<div class="sf"><div class="nv"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 8 8-8 8"/></svg></div><div class="url"><svg width="20" height="18" viewBox="0 0 20 18" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="1" width="16" height="11" rx="2"/><path d="M2 15h16"/></svg><span>localhost</span></div><div class="mo"><svg width="22" height="6" viewBox="0 0 22 6" fill="#fff"><circle cx="3" cy="3" r="2.4"/><circle cx="11" cy="3" r="2.4"/><circle cx="19" cy="3" r="2.4"/></svg></div></div>
<div class="hi"></div>`;
const CH_FRAME='<div class="phf"><i style="left:-6px;top:12.4%;height:3.1%"></i><i style="left:-6px;top:18.8%;height:6%"></i><i style="left:-6px;top:26.6%;height:6%"></i><i style="right:-6px;top:22.2%;height:9.3%"></i></div>';
const hm=()=>new Intl.DateTimeFormat([],{hour:'numeric',minute:'2-digit'}).formatToParts(new Date()).filter(x=>x.type!=='dayPeriod').map(x=>x.value.trim()).join('');
const tick=()=>document.querySelectorAll('.clk').forEach(e=>e.textContent=hm());setInterval(tick,1000);
const frames=['home','photo','design','pay'].map(k=>{const d=document.createElement('div');d.className='p';d.innerHTML=CH_FRAME+'<div class="scr wire">'+CH+'</div><div class="phs"></div>';const f=d.querySelector('iframe');f.src='index.html';g.append(d);return[k,f]});
function fit(){const w=4*402+3*60,h=874,k=Math.min(innerWidth/(w+80),innerHeight/(h+120));g.style.transform=`translate(${-w/2*k}px,${-h/2*k}px) scale(${k})`}fit();onresize=fit;
const until=async(fn,ms=20000)=>{const t=Date.now();while(Date.now()-t<ms){try{const v=fn();if(v)return v}catch{}await new Promise(r=>setTimeout(r,150))}};
tick();
frames.forEach(([k,f])=>f.onload=async()=>{
 const w=f.contentWindow;if(!await until(()=>w.__app))return;
 w.__app.S.offline=true; // 不调 AI，用页面内的模拟方案
 if(k==='photo')w.__app.goStep(1);
 if(k==='design'||k==='pay'){
  const T=await w.eval("import('./test-scene.js')");await T.start({}, {});
  const d=w.document;
  await until(()=>{const b=[...d.querySelectorAll('button.redo')].find(x=>x.textContent==='仍然使用');if(b){b.click();return true}return !d.getElementById('s-photo').hidden===false});
  await until(()=>{const gen=d.getElementById('gen');if(!gen.disabled&&!d.getElementById('s-design').hidden)return true;if(!gen.disabled&&!d.getElementById('s-photo').hidden)gen.click();return false});
  if(k==='pay'){await until(()=>w.__app.S.schemes.length&&w.__app.S.placed);w.__app.goStep(3)}
 }
});
// 版式验收（CLAUDE.md「版式总纲」）：控制台跑 __layout()，红/蓝每项应 = a(16)，绿每项应 = b(24)，scroll 应 = 0
// red = 卡片离屏幕 左/右/下/步骤条；blue = 卡片内容离卡片边 左/右/上/下（操作条按钮算在卡片里）；green = 角线离 左/右/步骤条/下方卡片
window.__layout=()=>frames.map(([k,f])=>{
 const d=f.contentDocument,w=f.contentWindow,W=w.innerWidth,H=w.innerHeight,rc=e=>e.getBoundingClientRect(),R=Math.round;
 const pg=[...d.querySelectorAll('.page')].find(p=>!p.hidden),q=s=>pg.querySelector(s),sb=rc(d.querySelector('#stepbar button')).bottom;
 const card=q('.sheet')||q(':scope > .row')||pg,c=rc(card),o={page:k,red:[c.left,W-c.right,H-c.bottom,c.top-sb].map(R)};
 const kids=[...card.querySelectorAll('button:not(.chips.swatch button),.btn,p,.label,.chips:not(.swatch),.dot,.rec,.size-row,h1,.lead'),...pg.querySelectorAll('.dock > button,.dock .price')].filter(e=>e.offsetParent&&rc(e).width&&rc(e).top>=c.top).map(rc);
 o.blue=[Math.min(...kids.map(r=>r.left))-c.left,c.right-Math.max(...kids.map(r=>r.right)),Math.min(...kids.map(r=>r.top))-c.top,c.bottom-Math.max(...kids.map(r=>r.bottom))].map(R);
 const host=[q('.guide'),q('.stage-box'),q('.pay .media')].find(e=>e&&e.offsetParent&&w.getComputedStyle(e,'::after').content!=='none');
 if(host){const r=rc(host),i=parseFloat(w.getComputedStyle(host,'::after').top),n=rc(q('.sheet')||q(':scope > .row'));o.green=[r.left+i,W-r.right+i,r.top+i-sb,n.top-r.bottom+i].map(R)}
 o.scroll=d.scrollingElement.scrollHeight-H;return o});
// 在每部手机上画出间距：同色 = 同一个值。红 a=16，绿 b=24，蓝 组内 8，粉 = 不在规则里；按钮虚线框：紫 48、青 40、粉 其它
const COL={16:'#e5484d',24:'#30a46c',8:'#0090ff'},BCOL={48:'#8e4ec6',40:'#12a594'},PINK='#d6409f';
function annotate(d,w){
 d.getElementById('__ann')?.remove();const W=w.innerWidth,H=w.innerHeight,rc=e=>e.getBoundingClientRect(),R=Math.round,vis=e=>e&&e.offsetParent&&rc(e).height>0;
 const box=d.createElement('div');box.id='__ann';box.style.cssText='position:fixed;inset:0;z-index:99;pointer-events:none;font:700 10px/1 system-ui';d.body.append(box);
 const seg=(x1,y1,x2,y2)=>{const v=R(Math.abs(x2-x1)+Math.abs(y2-y1));if(v<2)return;const c=COL[v]||PINK,e=d.createElement('i');
  e.style.cssText=`position:absolute;left:${Math.min(x1,x2)}px;top:${Math.min(y1,y2)}px;width:${Math.max(2,Math.abs(x2-x1))}px;height:${Math.max(2,Math.abs(y2-y1))}px;background:${c}`;
  const t=d.createElement('b');t.textContent=v;t.style.cssText=`position:absolute;left:${(x1+x2)/2+3}px;top:${(y1+y2)/2-5}px;color:${c};background:#fff;padding:1px 2px;border-radius:3px`;box.append(e,t)};
 const pg=[...d.querySelectorAll('.page')].find(p=>!p.hidden),q=s=>pg.querySelector(s),sb=rc(d.querySelector('#stepbar button')).bottom;
 // 卡片离屏幕 + 卡片内边距
 const card=q('.sheet')||q(':scope > .row')||pg,c=rc(card),cy=c.top+c.height*.3,cx=c.left+c.width*.3;
 seg(0,cy,c.left,cy);seg(c.right,cy,W,cy);seg(cx,c.bottom,cx,H);if(card===pg)seg(cx,sb,cx,c.top);
 const kids=[...card.querySelectorAll('button:not(.chips.swatch button),.btn,p,.label,.chips:not(.swatch),.dot,.rec,.size-row,h1,.lead'),...pg.querySelectorAll('.dock > button,.dock .price')].filter(e=>vis(e)&&rc(e).top>=c.top).map(rc);
 if(kids.length){const L=Math.min(...kids.map(r=>r.left)),Rr=Math.max(...kids.map(r=>r.right)),T=Math.min(...kids.map(r=>r.top)),B=Math.max(...kids.map(r=>r.bottom)),y=c.top+c.height*.6,x=c.left+c.width*.6;
  seg(c.left,y,L,y);seg(Rr,y,c.right,y);seg(x,c.top,x,T);seg(x,B,x,c.bottom)}
 // 相邻块之间的间隔（flex 容器里的兄弟元素）
 for(const k of [pg,...pg.querySelectorAll('.sheet,.panes,.pane,.grp,.row,.dock,#after,.head')].filter(vis)){
  const ch=[...k.children].filter(e=>vis(e)&&!e.matches('.media')&&!['absolute','fixed'].includes(w.getComputedStyle(e).position)).map(rc);
  ch.slice(1).forEach((b,i)=>{const a=ch[i];if(b.top-a.bottom>40)return; /* 大于 40 是弹性留白，不是间距 */if(b.top>=a.bottom-1){const x=Math.max(a.left,b.left)+24;seg(x,a.bottom,x,b.top)}else if(b.left>=a.right-1){const y=Math.max(a.top,b.top)+Math.min(a.height,b.height)/2;seg(a.right,y,b.left,y)}})}
 // 角线框
 const host=[q('.guide'),q('.stage-box'),q('.pay .media')].find(e=>e&&e.offsetParent&&w.getComputedStyle(e,'::after').content!=='none');
 if(host){const r=rc(host),i=parseFloat(w.getComputedStyle(host,'::after').top),F={l:r.left+i,r:r.right-i,t:r.top+i,b:r.bottom-i},n=rc(q('.sheet')||q(':scope > .row')),my=(F.t+F.b)/2,mx=F.l+(F.r-F.l)*.7;
  seg(0,my,F.l,my);seg(F.r,my,W,my);seg(mx,sb,mx,F.t);seg(mx,F.b,mx,n.top)}
 // 按钮高度
 for(const b of [...pg.querySelectorAll('button,.btn')].filter(e=>vis(e)&&!e.closest('.chips.cards,.chips.swatch')&&!e.matches('.step,.hubbtn,.x'))){const r=rc(b),h=R(r.height),c2=BCOL[h]||PINK,e=d.createElement('i');
  e.style.cssText=`position:absolute;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;box-sizing:border-box;border:1.5px dashed ${c2};border-radius:999px`;
  const t=d.createElement('b');t.textContent=h;t.style.cssText=`position:absolute;left:${r.right-18}px;top:${r.top-6}px;color:#fff;background:${c2};padding:1px 3px;border-radius:3px`;box.append(e,t)}
}
let annOn=false;const annAll=()=>frames.forEach(([,f])=>{const d=f.contentDocument;if(annOn)annotate(d,f.contentWindow);else d?.getElementById('__ann')?.remove()});
document.getElementById('ann').onclick=e=>{e.preventDefault();annOn=!annOn;e.target.textContent=annOn?'关闭标注':'标注间距';annAll()};
setInterval(()=>annOn&&annAll(),1000); // 页面切换或面板变化后跟着刷新
</script>
